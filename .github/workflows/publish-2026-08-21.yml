name: Publish Living Patterns 2026-08-21

on:
  push:
    paths:
      - .github/workflows/publish-2026-08-21.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and publish episode
        shell: bash
        run: |
          set -euo pipefail
          GUID="living-patterns-2026-08-21-03"
          AUDIO_FILENAME="2026-08-21-give-the-pause-a-shape.mp3"
          WORKFLOW_FILE=".github/workflows/publish-2026-08-21.yml"

          if grep -q "$GUID" feed.xml; then
            git rm -- "$WORKFLOW_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove completed Living Patterns publication job"
            git push
            exit 0
          fi

          RUN_DIR="$RUNNER_TEMP/living-patterns"
          mkdir -p "$RUN_DIR/scripts" "$RUN_DIR/node"
          cat > "$RUN_DIR/segment-1.txt" <<'TEXT'
          Living Patterns.
          Give the pause a shape.

          Empty space is often treated as what remains after the important parts have been arranged. Yet in places that feel whole, emptiness is rarely accidental. A courtyard is not merely the gap between walls. A clearing is not simply where trees are absent. Each becomes a positive center because its boundary, proportion, and relation to movement give it a distinct character.
          TEXT
          cat > "$RUN_DIR/segment-2.txt" <<'TEXT'
          The same is true of time. A blank interval can feel restless when it is only the leftover between obligations. But a pause with a clear beginning and end can hold attention. Ten minutes by an open window, a slow walk around one block, or a cup prepared without another task beside it can become a small room in the day.

          What matters is not filling the interval. It is giving the emptiness enough form that we can enter it. A path may approach a garden slowly. A margin may let words breathe. A quiet period may be protected from messages. Boundaries do not diminish the open space; they allow its calm to become perceptible.
          TEXT
          cat > "$RUN_DIR/segment-3.txt" <<'TEXT'
          This kind of void supports the larger whole. It separates without isolating and rests without becoming inert. When every surface, hour, or conversation is crowded, nothing has room to gather meaning. A shaped pause lets surrounding activity recover its rhythm.

          A small practice.

          Choose one transition in your day and protect a fifteen-minute margin around it. Give the interval a simple boundary—close the screen, step outside, or sit in one chosen place—and leave it otherwise unfilled.
          TEXT

          VOICE="Daniel"
          VOICE_METADATA="Daniel (en_GB), 145 words per minute"
          if ! say -v '?' | grep -q '^Daniel'; then
            VOICE="Grandpa (English (UK))"
            VOICE_METADATA="Grandpa (English (UK)), 145 words per minute"
          fi
          echo "VOICE_USED=$VOICE_METADATA"
          say -v "$VOICE" -r 145 -f "$RUN_DIR/segment-1.txt" -o "$RUN_DIR/segment-1.aiff"
          say -v "$VOICE" -r 145 -f "$RUN_DIR/segment-2.txt" -o "$RUN_DIR/segment-2.aiff"
          say -v "$VOICE" -r 145 -f "$RUN_DIR/segment-3.txt" -o "$RUN_DIR/segment-3.aiff"

          npm install --prefix "$RUN_DIR/node" lamejs@1.2.1 --no-audit --no-fund
          cat > "$RUN_DIR/scripts/encode-aiff.cjs" <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const path = require("node:path");
          const args = process.argv.slice(2);
          let silenceSeconds = 0;
          if (args[0] === "--silence-seconds") {
            args.shift();
            silenceSeconds = Number(args.shift());
          }
          const outputPath = args.pop();
          const inputPaths = args;
          const lameBundle = fs.readFileSync(path.join(process.env.LAME_ROOT, "lamejs", "lame.min.js"), "utf8");
          const sandbox = {};
          vm.createContext(sandbox);
          vm.runInContext(lameBundle, sandbox);
          const lamejs = sandbox.lamejs;
          function readExtended80(buffer, offset) {
            const exponent = buffer.readUInt16BE(offset);
            const high = buffer.readUInt32BE(offset + 2);
            const low = buffer.readUInt32BE(offset + 6);
            if (exponent === 0 && high === 0 && low === 0) return 0;
            const sign = exponent & 0x8000 ? -1 : 1;
            const power = (exponent & 0x7fff) - 16383;
            return sign * (high * 2 ** 32 + low) * 2 ** (power - 63);
          }
          function parseAiff(inputPath) {
            const source = fs.readFileSync(inputPath);
            if (source.toString("ascii", 0, 4) !== "FORM") throw new Error("Expected AIFF: " + inputPath);
            let channels = 1;
            let sampleRate = 44100;
            let bitsPerSample = 16;
            let soundData;
            let cursor = 12;
            while (cursor + 8 <= source.length) {
              const id = source.toString("ascii", cursor, cursor + 4);
              const size = source.readUInt32BE(cursor + 4);
              const start = cursor + 8;
              if (id === "COMM") {
                channels = source.readUInt16BE(start);
                bitsPerSample = source.readUInt16BE(start + 6);
                sampleRate = Math.round(readExtended80(source, start + 8));
              } else if (id === "SSND") {
                const offset = source.readUInt32BE(start);
                soundData = source.subarray(start + 8 + offset, start + size);
              }
              cursor = start + size + (size % 2);
            }
            if (!soundData || channels !== 1 || bitsPerSample !== 16) throw new Error("Unsupported AIFF");
            const samples = new Int16Array(Math.floor(soundData.length / 2));
            for (let i = 0; i < samples.length; i += 1) samples[i] = soundData.readInt16BE(i * 2);
            return { channels, sampleRate, bitsPerSample, samples };
          }
          const segments = inputPaths.map(parseAiff);
          const sampleRate = segments[0].sampleRate;
          for (const segment of segments.slice(1)) {
            if (segment.sampleRate !== sampleRate) throw new Error("AIFF sample rates differ");
          }
          const silenceSamples = Math.round(silenceSeconds * sampleRate);
          const totalSamples = segments.reduce((n, s) => n + s.samples.length, 0) + silenceSamples * (segments.length - 1);
          const samples = new Int16Array(totalSamples);
          let offset = 0;
          for (const segment of segments) {
            samples.set(segment.samples, offset);
            offset += segment.samples.length + silenceSamples;
          }
          const encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
          const chunks = [];
          for (let i = 0; i < samples.length; i += 1152) {
            const encoded = encoder.encodeBuffer(samples.subarray(i, i + 1152));
            if (encoded.length) chunks.push(Buffer.from(encoded));
          }
          const flushed = encoder.flush();
          if (flushed.length) chunks.push(Buffer.from(flushed));
          const output = Buffer.concat(chunks);
          fs.writeFileSync(outputPath, output);
          const seconds = samples.length / sampleRate;
          const duration = Math.floor(seconds / 60) + ":" + String(Math.round(seconds) % 60).padStart(2, "0");
          console.log(JSON.stringify({ outputPath, audioBytes: output.length, seconds, duration, segments: segments.length, insertedSilences: segments.length - 1, silenceSeconds }));
          NODE

          LAME_ROOT="$RUN_DIR/node/node_modules" node "$RUN_DIR/scripts/encode-aiff.cjs" --silence-seconds 10 "$RUN_DIR/segment-1.aiff" "$RUN_DIR/segment-2.aiff" "$RUN_DIR/segment-3.aiff" "$AUDIO_FILENAME" | tee "$RUN_DIR/encode.json"

          node - "$AUDIO_FILENAME" "$VOICE_METADATA" <<'NODE'
          const fs = require("node:fs");
          const audioFilename = process.argv[2];
          const voice = process.argv[3];
          const base = "https://udeudeude.github.io/Living-Patterns-Podcast";
          const title = "Give the pause a shape";
          const description = "A pause becomes restorative when it is given enough boundary and form to be entered as a positive part of the day.";
          const reflection = "Empty space is often treated as what remains after the important parts have been arranged. Yet in places that feel whole, emptiness is rarely accidental. A courtyard is not merely the gap between walls. A clearing is not simply where trees are absent. Each becomes a positive center because its boundary, proportion, and relation to movement give it a distinct character.\n\nThe same is true of time. A blank interval can feel restless when it is only the leftover between obligations. But a pause with a clear beginning and end can hold attention. Ten minutes by an open window, a slow walk around one block, or a cup prepared without another task beside it can become a small room in the day.\n\nWhat matters is not filling the interval. It is giving the emptiness enough form that we can enter it. A path may approach a garden slowly. A margin may let words breathe. A quiet period may be protected from messages. Boundaries do not diminish the open space; they allow its calm to become perceptible.\n\nThis kind of void supports the larger whole. It separates without isolating and rests without becoming inert. When every surface, hour, or conversation is crowded, nothing has room to gather meaning. A shaped pause lets surrounding activity recover its rhythm.";
          const practice = "Choose one transition in your day and protect a fifteen-minute margin around it. Give the interval a simple boundary—close the screen, step outside, or sit in one chosen place—and leave it otherwise unfilled.";
          const guid = "living-patterns-2026-08-21-03";
          const publishedAt = "2026-08-21T13:58:27Z";
          const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/living-patterns/encode.json", "utf8"));
          if (data.insertedSilences !== 2 || data.silenceSeconds !== 10 || data.segments !== 3) throw new Error("Pause verification failed");
          if (fs.statSync(audioFilename).size !== data.audioBytes) throw new Error("Audio byte verification failed");
          const esc = (v) => String(v).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
          const fullText = reflection + "\n\nA small practice\n" + practice;
          const item = "<item><title>" + esc(title) + "</title><description>" + esc(description) + "</description><content:encoded><![CDATA[" + fullText + "]]></content:encoded><link>" + base + "/</link><guid isPermaLink=\"false\">" + guid + "</guid><pubDate>" + new Date(publishedAt).toUTCString() + "</pubDate><enclosure url=\"" + base + "/" + audioFilename + "\" length=\"" + data.audioBytes + "\" type=\"audio/mpeg\"/><itunes:title>" + esc(title) + "</itunes:title><itunes:author>Daily Living Patterns</itunes:author><itunes:summary>" + esc(description) + "</itunes:summary><itunes:duration>" + data.duration + "</itunes:duration><itunes:episode>3</itunes:episode><itunes:episodeType>full</itunes:episodeType><itunes:explicit>false</itunes:explicit></item>";
          let rss = fs.readFileSync("feed.xml", "utf8");
          if ((rss.match(new RegExp(guid, "g")) || []).length !== 0) throw new Error("GUID already exists");
          if (rss.includes("<itunes:episode>3</itunes:episode>")) throw new Error("Episode number already exists");
          rss = rss.replace(/<lastBuildDate>[^<]*<\/lastBuildDate>/, "<lastBuildDate>" + new Date(publishedAt).toUTCString() + "</lastBuildDate>");
          rss = rss.replace("<item>", item + "<item>");
          fs.writeFileSync("feed.xml", rss);

          const paragraphs = reflection.split("\n\n").map((p) => "<p>" + esc(p) + "</p>").join("");
          const article = "<article><p class=\"date\">21 August 2026 · " + data.duration + "</p><h2>" + esc(title) + "</h2><audio controls preload=\"metadata\" src=\"" + base + "/" + audioFilename + "\"></audio><p class=\"summary\">" + esc(description) + "</p><details><summary>Read the reflection</summary><div class=\"transcript\">" + paragraphs + "<h3>A small practice</h3><p>" + esc(practice) + "</p></div></details></article>";
          let html = fs.readFileSync("index.html", "utf8");
          html = html.replace(/<article>[\s\S]*?<\/article>/, article);
          fs.writeFileSync("index.html", html);
          console.log("EPISODE_METADATA=" + JSON.stringify({ title, guid, publishedAt, duration: data.duration, audioBytes: data.audioBytes, voice, insertedSilences: data.insertedSilences, silenceSeconds: data.silenceSeconds }));
          NODE

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse("feed.xml").getroot()
          guid = "living-patterns-2026-08-21-03"
          items = [item for item in root.findall("./channel/item") if item.findtext("guid") == guid]
          assert len(items) == 1
          enc = items[0].find("enclosure")
          audio = "2026-08-21-give-the-pause-a-shape.mp3"
          assert enc.attrib["url"] == "https://udeudeude.github.io/Living-Patterns-Podcast/" + audio
          assert int(enc.attrib["length"]) == os.path.getsize(audio)
          assert enc.attrib["type"] == "audio/mpeg"
          html = open("index.html", encoding="utf-8").read()
          assert "https://udeudeude.github.io/Living-Patterns-Podcast/" + audio in html
          assert "https://udeudeude.github.io/Living-Patterns-Podcast/feed.xml" in html
          feed = open("feed.xml", encoding="utf-8").read()
          assert "https://udeudeude.github.io/Living-Patterns-Podcast/living-patterns-cover.jpg" in feed
          assert feed.count(guid) == 1
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- "$WORKFLOW_FILE"
          git add -- index.html feed.xml "$AUDIO_FILENAME"
          git commit -m "Publish Living Patterns episode for 2026-08-21"
          git push
