name: Render title inflection audition

on:
  push:
    paths:
      - ".github/workflows/title-inflection-audition.yml"

permissions:
  contents: write

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install light-weight pitch editing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install praat-parselmouth numpy soundfile
      - name: Produce four samples with the same voice and words
        run: |
          set -euo pipefail
          python3 scripts/adjust_title_inflection.py
          test "$(find auditions/inflection -maxdepth 1 -name '*.mp3' | wc -l)" -eq 4
          for f in auditions/inflection/*.mp3; do
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$f"
          done
      - name: Commit unlisted samples and retire one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/title-inflection-audition.yml
          git add auditions/inflection/
          git commit -m "Add title-only inflection listening tests"
          git push
