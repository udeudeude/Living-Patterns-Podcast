name: Publish Living Patterns 2026-08-22

on:
  push:
    branches:
      - codex/publish-living-patterns-20260822
    paths:
      - .github/workflows/publish-2026-08-22.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate, validate, and publish episode
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main

          GUID="living-patterns-2026-08-22-04"
          AUDIO_FILENAME="2026-08-22-let-the-repair-remain-legible.mp3"
          if grep -q "$GUID" feed.xml || grep -q "Sat, 22 Aug 2026" feed.xml; then
            echo "SAFE_SKIP=Episode for 2026-08-22 already exists"
            exit 0
          fi
          if grep -q '<itunes:episode>4</itunes:episode>' feed.xml; then
            echo "Episode number 4 already exists" >&2
            exit 1
          fi

          BASE_HEAD="$(git rev-parse HEAD)"
          BASE_FEED_SHA="$(git rev-parse HEAD:feed.xml)"
          BASE_INDEX_SHA="$(git rev-parse HEAD:index.html)"
          RUN_DIR="$RUNNER_TEMP/living-patterns-20260822"
          mkdir -p "$RUN_DIR/scripts" "$RUN_DIR/node"

          cat > "$RUN_DIR/segment-1.txt" <<'TEXT'
          Living Patterns.
          Let the repair remain legible.

          A repair is often judged by how completely it disappears. We praise the patch that leaves no trace and the replacement that makes an object seem untouched. Yet a place that has lived for any length of time cannot remain untouched. Its surfaces record weather, use, strain, and care.
          TEXT

          cat > "$RUN_DIR/segment-2.txt" <<'TEXT'
          In living structure, repair can become part of the form rather than an apology for damage. A new piece of wood set into a worn step may differ slightly in colour. Fresh mortar between old stones may reveal where water once entered. The contrast can be quiet, but it tells the truth: this part weakened, someone noticed, and the whole was worth tending.

          Concealment is sometimes right, especially when a repair would distract or perform itself too loudly. But an honest join has another virtue. It makes later care easier. We can see what was changed, watch how it ages, and adjust again if necessary. The work remains open to participation rather than pretending to be final.
          TEXT

          cat > "$RUN_DIR/segment-3.txt" <<'TEXT'
          The same principle applies to habits and agreements. When a routine is revised, it helps to name the reason and leave a simple way to review the result. A visible adjustment carries memory forward. It allows improvement to accumulate instead of forcing each new effort to begin from ignorance.

          A small practice.

          Find one repaired or worn thing you encounter today. Look for the point where old and new meet, and ask whether making that join clearer would help someone care for it next time.
          TEXT

          VOICE="Daniel"
          VOICE_METADATA="Daniel (en_GB), 145 words per minute"
          if ! say -v '?' | grep -q '^Daniel[[:space:]]'; then
            VOICE="Grandpa (English (UK))"
            VOICE_METADATA="Grandpa (English (UK)), 145 words per minute"
          fi
          if ! say -v '?' | grep -Fq "$VOICE"; then
            echo "Required narration voice unavailable" >&2
            exit 1
          fi
          echo "VOICE_USED=$VOICE_METADATA"

          say -v "$VOICE" -r 145 -f "$RUN_DIR/segment-1.txt" -o "$RUN_DIR/segment-1.aiff"
          say -v "$VOICE" -r 145 -f "$RUN_DIR/segment-2.txt" -o "$RUN_DIR/segment-2.aiff"
          say -v "$VOICE" -r 145 -f "$RUN_DIR/segment-3.txt" -o "$RUN_DIR/segment-3.aiff"

          npm install --prefix "$RUN_DIR/node" lamejs@1.2.1 --no-audit --no-fund
          cat > "$RUN_DIR/scripts/encode-aiff.cjs" <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const path = require("node:path");
          const args = process.argv.slice(2);
          let silenceSeconds = 0;
          if (args[0] === "--silence-seconds") {
            args.shift();
            silenceSeconds = Number(args.shift());
          }
          const outputPath = args.pop();
          const inputPaths = args;
          const lameBundle = fs.readFileSync(path.join(process.env.LAME_ROOT, "lamejs", "lame.min.js"), "utf8");
          const sandbox = {};
          vm.createContext(sandbox);
          vm.runInContext(lameBundle, sandbox);
          const lamejs = sandbox.lamejs;

          function readExtended80(buffer, offset) {
            const exponent = buffer.readUInt16BE(offset);
            const high = buffer.readUInt32BE(offset + 2);
            const low = buffer.readUInt32BE(offset + 6);
            if (exponent === 0 && high === 0 && low === 0) return 0;
            const sign = exponent & 0x8000 ? -1 : 1;
            const power = (exponent & 0x7fff) - 16383;
            return sign * (high * 2 ** 32 + low) * 2 ** (power - 63);
          }

          function parseAiff(inputPath) {
            const source = fs.readFileSync(inputPath);
            if (source.toString("ascii", 0, 4) !== "FORM") throw new Error("Expected AIFF: " + inputPath);
            let channels = 1;
            let sampleRate = 44100;
            let bitsPerSample = 16;
            let soundData;
            let cursor = 12;
            while (cursor + 8 <= source.length) {
              const id = source.toString("ascii", cursor, cursor + 4);
              const size = source.readUInt32BE(cursor + 4);
              const start = cursor + 8;
              if (id === "COMM") {
                channels = source.readUInt16BE(start);
                bitsPerSample = source.readUInt16BE(start + 6);
                sampleRate = Math.round(readExtended80(source, start + 8));
              } else if (id === "SSND") {
                const offset = source.readUInt32BE(start);
                soundData = source.subarray(start + 8 + offset, start + size);
              }
              cursor = start + size + (size % 2);
            }
            if (!soundData || channels !== 1 || bitsPerSample !== 16) throw new Error("Unsupported AIFF");
            const samples = new Int16Array(Math.floor(soundData.length / 2));
            for (let i = 0; i < samples.length; i += 1) samples[i] = soundData.readInt16BE(i * 2);
            return { sampleRate, samples };
          }

          const segments = inputPaths.map(parseAiff);
          const sampleRate = segments[0].sampleRate;
          for (const segment of segments.slice(1)) {
            if (segment.sampleRate !== sampleRate) throw new Error("AIFF sample rates differ");
          }
          const silenceSamples = Math.round(silenceSeconds * sampleRate);
          const totalSamples = segments.reduce((n, s) => n + s.samples.length, 0) + silenceSamples * (segments.length - 1);
          const samples = new Int16Array(totalSamples);
          let offset = 0;
          for (const segment of segments) {
            samples.set(segment.samples, offset);
            offset += segment.samples.length + silenceSamples;
          }
          const encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
          const chunks = [];
          for (let i = 0; i < samples.length; i += 1152) {
            const encoded = encoder.encodeBuffer(samples.subarray(i, i + 1152));
            if (encoded.length) chunks.push(Buffer.from(encoded));
          }
          const flushed = encoder.flush();
          if (flushed.length) chunks.push(Buffer.from(flushed));
          const output = Buffer.concat(chunks);
          fs.writeFileSync(outputPath, output);
          const seconds = samples.length / sampleRate;
          const rounded = Math.round(seconds);
          const duration = Math.floor(rounded / 60) + ":" + String(rounded % 60).padStart(2, "0");
          console.log(JSON.stringify({
            outputPath,
            audioBytes: output.length,
            seconds,
            duration,
            segments: segments.length,
            insertedSilences: segments.length - 1,
            silenceSeconds
          }));
          NODE

          LAME_ROOT="$RUN_DIR/node/node_modules" node "$RUN_DIR/scripts/encode-aiff.cjs" --silence-seconds 10             "$RUN_DIR/segment-1.aiff" "$RUN_DIR/segment-2.aiff" "$RUN_DIR/segment-3.aiff" "$AUDIO_FILENAME"             | tee "$RUN_DIR/encode.json"

          node - "$AUDIO_FILENAME" "$VOICE_METADATA" "$RUN_DIR/encode.json" <<'NODE'
          const fs = require("node:fs");
          const audioFilename = process.argv[2];
          const voice = process.argv[3];
          const encodePath = process.argv[4];
          const base = "https://udeudeude.github.io/Living-Patterns-Podcast";
          const title = "Let the repair remain legible";
          const description = "An honest repair can strengthen the whole by preserving memory and making future care easier.";
          const reflection = "A repair is often judged by how completely it disappears. We praise the patch that leaves no trace and the replacement that makes an object seem untouched. Yet a place that has lived for any length of time cannot remain untouched. Its surfaces record weather, use, strain, and care.\n\nIn living structure, repair can become part of the form rather than an apology for damage. A new piece of wood set into a worn step may differ slightly in colour. Fresh mortar between old stones may reveal where water once entered. The contrast can be quiet, but it tells the truth: this part weakened, someone noticed, and the whole was worth tending.\n\nConcealment is sometimes right, especially when a repair would distract or perform itself too loudly. But an honest join has another virtue. It makes later care easier. We can see what was changed, watch how it ages, and adjust again if necessary. The work remains open to participation rather than pretending to be final.\n\nThe same principle applies to habits and agreements. When a routine is revised, it helps to name the reason and leave a simple way to review the result. A visible adjustment carries memory forward. It allows improvement to accumulate instead of forcing each new effort to begin from ignorance.";
          const practice = "Find one repaired or worn thing you encounter today. Look for the point where old and new meet, and ask whether making that join clearer would help someone care for it next time.";
          const guid = "living-patterns-2026-08-22-04";
          const publishedAt = "2026-08-22T16:06:12Z";
          const data = JSON.parse(fs.readFileSync(encodePath, "utf8"));
          if (data.insertedSilences !== 2 || data.silenceSeconds !== 10 || data.segments !== 3) throw new Error("Pause verification failed");
          if (fs.statSync(audioFilename).size !== data.audioBytes) throw new Error("Audio byte verification failed");
          const spokenWords = (reflection + " " + practice).match(/\b[\p{L}\p{N}’'-]+\b/gu) || [];
          if (spokenWords.length < 220 || spokenWords.length > 280) throw new Error("Word count outside 220-280: " + spokenWords.length);
          const esc = (v) => String(v).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
          const fullText = reflection + "\n\nA small practice\n" + practice;
          const item = "<item><title>" + esc(title) + "</title><description>" + esc(description) + "</description><content:encoded><![CDATA[" + fullText + "]]></content:encoded><link>" + base + "/</link><guid isPermaLink=\"false\">" + guid + "</guid><pubDate>" + new Date(publishedAt).toUTCString() + "</pubDate><enclosure url=\"" + base + "/" + audioFilename + "\" length=\"" + data.audioBytes + "\" type=\"audio/mpeg\"/><itunes:title>" + esc(title) + "</itunes:title><itunes:author>Daily Living Patterns</itunes:author><itunes:summary>" + esc(description) + "</itunes:summary><itunes:duration>" + data.duration + "</itunes:duration><itunes:episode>4</itunes:episode><itunes:episodeType>full</itunes:episodeType><itunes:explicit>false</itunes:explicit></item>";

          let rss = fs.readFileSync("feed.xml", "utf8");
          if ((rss.match(new RegExp(guid, "g")) || []).length !== 0) throw new Error("GUID already exists");
          if (rss.includes("<itunes:episode>4</itunes:episode>")) throw new Error("Episode number already exists");
          rss = rss.replace(/<lastBuildDate>[^<]*<\/lastBuildDate>/, "<lastBuildDate>" + new Date(publishedAt).toUTCString() + "</lastBuildDate>");
          rss = rss.replace("<item>", item + "<item>");
          fs.writeFileSync("feed.xml", rss);

          const paragraphs = reflection.split("\n\n").map((p) => "<p>" + esc(p) + "</p>").join("");
          const article = "<article><p class=\"date\">22 August 2026 · " + data.duration + "</p><h2>" + esc(title) + "</h2><audio controls preload=\"metadata\" src=\"" + base + "/" + audioFilename + "\"></audio><p class=\"summary\">" + esc(description) + "</p><details><summary>Read the reflection</summary><div class=\"transcript\">" + paragraphs + "<h3>A small practice</h3><p>" + esc(practice) + "</p></div></details></article>";
          let html = fs.readFileSync("index.html", "utf8");
          html = html.replace(/<article>[\s\S]*?<\/article>/, article);
          fs.writeFileSync("index.html", html);

          console.log("EPISODE_METADATA=" + JSON.stringify({
            title, guid, publishedAt, duration: data.duration, audioBytes: data.audioBytes,
            voice, wordCount: spokenWords.length, insertedSilences: data.insertedSilences,
            silenceSeconds: data.silenceSeconds, audioFilename
          }));
          NODE

          python3 -c 'import os, xml.etree.ElementTree as ET; root=ET.parse("feed.xml").getroot(); guid="living-patterns-2026-08-22-04"; items=[i for i in root.findall("./channel/item") if i.findtext("guid")==guid]; assert len(items)==1; enc=items[0].find("enclosure"); audio="2026-08-22-let-the-repair-remain-legible.mp3"; assert enc.attrib["url"]=="https://udeudeude.github.io/Living-Patterns-Podcast/"+audio; assert int(enc.attrib["length"])==os.path.getsize(audio); assert enc.attrib["type"]=="audio/mpeg"; html=open("index.html",encoding="utf-8").read(); assert "https://udeudeude.github.io/Living-Patterns-Podcast/"+audio in html; assert "https://udeudeude.github.io/Living-Patterns-Podcast/feed.xml" in html; feed=open("feed.xml",encoding="utf-8").read(); assert feed.count(guid)==1; assert "https://udeudeude.github.io/Living-Patterns-Podcast/living-patterns-cover.jpg" in feed'

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_HEAD" ]; then
            echo "Main changed during publication; refusing to overwrite concurrent work" >&2
            exit 1
          fi
          if [ "$(git rev-parse "$BASE_HEAD":feed.xml)" != "$BASE_FEED_SHA" ] || [ "$(git rev-parse "$BASE_HEAD":index.html)" != "$BASE_INDEX_SHA" ]; then
            echo "Source blob verification failed" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html feed.xml "$AUDIO_FILENAME"
          git commit -m "Publish Living Patterns episode for 2026-08-22"
          git push origin main
