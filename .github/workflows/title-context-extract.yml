name: Extract naturally spoken title

on:
  push:
    paths:
      - .github/workflows/title-context-extract.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install alignment and audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install faster-whisper numpy soundfile
      - name: Extract title from context
        run: |
          set -euo pipefail
          python3 scripts/extract_title_from_context.py
          test "$(find auditions/context/ -maxdepth 1 -name '*.mp3' | wc -l)" -eq 2
          for audio in auditions/context/*.mp3; do
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$audio"
          done
      - name: Commit audition and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/title-context-extract.yml
          git add auditions/context/
          git commit -m "Add naturally spoken title-only comparisons"
          git push
