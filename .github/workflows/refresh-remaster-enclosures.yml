name: Refresh remastered episode enclosure URLs

on:
  push:
    paths:
      - .github/workflows/refresh-remaster-enclosures.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create fresh enclosure filenames and update references
        run: |
          set -euo pipefail

          OLD1="2026-08-18-begin-with-the-place-that-already-works.mp3"
          NEW1="2026-08-18-begin-with-the-place-that-already-works-remastered.mp3"
          OLD2="2026-08-19-make-room-for-the-middle.mp3"
          NEW2="2026-08-19-make-room-for-the-middle-remastered.mp3"

          cp "$OLD1" "$NEW1"
          cp "$OLD2" "$NEW2"

          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          replacements = {
              "2026-08-18-begin-with-the-place-that-already-works.mp3":
                  "2026-08-18-begin-with-the-place-that-already-works-remastered.mp3",
              "2026-08-19-make-room-for-the-middle.mp3":
                  "2026-08-19-make-room-for-the-middle-remastered.mp3",
          }

          feedp = Path("feed.xml")
          feed = feedp.read_text(encoding="utf-8")
          for old, new in replacements.items():
              feed = feed.replace("/" + old + '"', "/" + new + '"')
          feed = re.sub(
              r"<lastBuildDate>[^<]*</lastBuildDate>",
              "<lastBuildDate>Wed, 07 Oct 2026 02:20:00 GMT</lastBuildDate>",
              feed,
          )
          feedp.write_text(feed, encoding="utf-8")

          htmlp = Path("index.html")
          html = htmlp.read_text(encoding="utf-8")
          for old, new in replacements.items():
              html = html.replace("/" + old + '"', "/" + new + '"')
          htmlp.write_text(html, encoding="utf-8")

          root = ET.parse(feedp).getroot()
          items = root.findall("./channel/item")
          guids = {
              "living-patterns-2026-08-18-01":
                  "2026-08-18-begin-with-the-place-that-already-works-remastered.mp3",
              "living-patterns-2026-08-19-02":
                  "2026-08-19-make-room-for-the-middle-remastered.mp3",
          }
          for guid, filename in guids.items():
              matches = [i for i in items if i.findtext("guid") == guid]
              assert len(matches) == 1
              enc = matches[0].find("enclosure")
              assert enc is not None
              assert enc.attrib["url"].endswith("/" + filename)
              assert Path(filename).exists()
              assert int(enc.attrib["length"]) == Path(filename).stat().st_size

          html_check = htmlp.read_text(encoding="utf-8")
          for filename in guids.values():
              assert filename in html_check

          print("Fresh enclosure URLs validated")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- ".github/workflows/refresh-remaster-enclosures.yml"
          git add -- feed.xml index.html             "$NEW1" "$NEW2"
          git commit -m "Refresh remastered episode enclosure URLs"
          git push
