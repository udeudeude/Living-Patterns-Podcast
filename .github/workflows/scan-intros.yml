name: Inspect podcast episode intros

on:
  push:
    paths:
      - .github/workflows/scan-intros.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install light audio analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install numpy
      - name: Report voice intervals for each episode
        run: python3 scripts/scan_intros.py
